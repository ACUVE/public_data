<script>
async function openSealed(p, passphrase, onTry) {
  const s = crypto.subtle, te = new TextEncoder();
  const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  const kdf = p.kdf || {};
  const KDF = ["SHA-256","SHA-384","SHA-512"], WRAP = ["aes-kw-256","aes-kw-128","aes-gcm-256","aes-gcm-128","chacha20-poly1305"], CIPHER = ["aes-256-gcm","aes-128-gcm","chacha20-poly1305","aes-256-ctr-hmac","aes-128-ctr-hmac","aes-256-cbc-hmac","aes-128-cbc-hmac"], MAC = ["SHA-256","SHA-384","SHA-512"], COMP = ["gzip","deflate","deflate-raw","none"];
  const hmac = typeof p.cipher === 'string' && p.cipher.endsWith('-hmac');
  if (p.v !== 1 || !Array.isArray(p.keys) || p.keys.length === 0) throw new Error('形が違う');
  if (kdf.name !== 'pbkdf2' || !KDF.includes(kdf.hash) || !Number.isInteger(kdf.iterations) || kdf.iterations < 600000 || kdf.iterations > 2000000) throw new Error('形が違う');
  if (!WRAP.includes(p.wrap) || !CIPHER.includes(p.cipher) || !COMP.includes(p.compress) || (hmac ? !MAC.includes(p.macHash) : p.macHash !== undefined)) throw new Error('形が違う');
  const binding = te.encode('mission-control-sealed-html-v1|' + p.id + '|' + JSON.stringify([kdf.hash, kdf.iterations, p.wrap, p.cipher, p.macHash || '', p.compress]));
  const wrapAlg = p.wrap === 'chacha20-poly1305' ? { name: 'ChaCha20-Poly1305' } : { name: p.wrap.startsWith('aes-kw') ? 'AES-KW' : 'AES-GCM', length: Number(p.wrap.slice(-3)) };
  const cipherAlg = p.cipher === 'chacha20-poly1305' ? { name: 'ChaCha20-Poly1305' } : { name: 'AES-' + p.cipher.split('-')[2].toUpperCase(), length: Number(p.cipher.split('-')[1]) };
  const base = await s.importKey('raw', te.encode(passphrase.normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
  for (const [i, k] of p.keys.entries()) {
    if (onTry) onTry(i + 1, p.keys.length);
    const bits = await s.deriveBits({ name: 'PBKDF2', hash: kdf.hash, salt: b64(k.salt), iterations: kdf.iterations }, base, 256);
    const ikm = await s.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
    const kek = await s.deriveKey({ name: 'HKDF', hash: kdf.hash, salt: new Uint8Array(0), info: binding }, ikm, wrapAlg, false, p.wrap.startsWith('aes-kw') ? ['unwrapKey'] : ['decrypt']);
    let master;
    try {
      master = p.wrap.startsWith('aes-kw')
        ? new Uint8Array(await s.exportKey('raw', await s.unwrapKey('raw', b64(k.wrapped), kek, 'AES-KW', { name: 'AES-GCM' }, true, ['encrypt'])))
        : new Uint8Array(await s.decrypt({ ...wrapAlg, iv: b64(k.iv), additionalData: binding }, kek, b64(k.wrapped)));
    } catch {
      continue;
    }
    const mk = await s.importKey('raw', master, 'HKDF', false, ['deriveKey']);
    const h = { name: 'HKDF', hash: kdf.hash, salt: new Uint8Array(0) };
    const key = await s.deriveKey({ ...h, info: te.encode('enc|' + p.id) }, mk, cipherAlg, false, ['decrypt']);
    const iv = b64(p.iv), ct = b64(p.ct);
    let plain;
    if (!hmac) {
      plain = await s.decrypt({ ...cipherAlg, iv, additionalData: binding }, key, ct);
    } else {
      const mac = await s.deriveKey({ ...h, info: te.encode('mac|' + p.id) }, mk, { name: 'HMAC', hash: p.macHash, length: 256 }, false, ['verify']);
      const signed = new Uint8Array(binding.length + iv.length + ct.length);
      signed.set(binding); signed.set(iv, binding.length); signed.set(ct, binding.length + iv.length);
      if (!(await s.verify('HMAC', mac, b64(p.mac || ''), signed))) throw new Error('改ざんされている');
      plain = await s.decrypt(p.cipher.includes('-ctr-') ? { name: 'AES-CTR', counter: iv, length: 64 } : { name: 'AES-CBC', iv }, key, ct);
    }
    const text = p.compress === 'none' ? new TextDecoder().decode(plain) : await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream(p.compress))).text();
    return JSON.parse(text);
  }
  throw new Error('パスフレーズが違う');
}

function takeKey(loc, hist) {
  const params = new URLSearchParams(loc.hash.slice(1));
  const key = params.get('key');
  if (key === null) return null;
  params.delete('key');
  const rest = params.toString();
  try {
    hist.replaceState(hist.state, '', loc.pathname + loc.search + (rest ? '#' + rest : ''));
  } catch {
    // 消せなくても開く
  }
  return key;
}

const payload = JSON.parse(document.getElementById('sealed').textContent);
const form = document.getElementById('f'), input = document.getElementById('p'), msg = document.getElementById('m');
async function tryOpen(passphrase) {
  msg.style.color = '';
  form.querySelector('button').disabled = true;
  try {
    const c = await openSealed(payload, passphrase, (i, n) => { msg.textContent = n > 1 ? '開いている…（' + i + ' / ' + n + ' 個目の鍵を試している）' : '開いている…'; });
    input.value = '';
    document.title = c.title;
    const frame = document.createElement('iframe');
    frame.setAttribute('sandbox', 'allow-popups allow-popups-to-escape-sandbox');
    frame.setAttribute('referrerpolicy', 'no-referrer');
    frame.srcdoc = c.html;
    document.body.replaceChildren(frame);
  } catch (err) {
    msg.style.color = '#b00';
    msg.textContent = err && err.message === 'パスフレーズが違う' ? 'パスフレーズが違う' : '開けなかった: ' + (err && err.message);
    form.querySelector('button').disabled = false;
  }
}
form.addEventListener('submit', e => {
  e.preventDefault();
  tryOpen(input.value);
});
const fromUrl = takeKey(location, history);
if (fromUrl !== null) tryOpen(fromUrl);
