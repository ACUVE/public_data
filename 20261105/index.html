<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2019 年 4 月以降に「広く使える」になった Web の機能</title>
<style>
body{--bg:#fff;--th:#f6f8fa;--glass:blur(16px) saturate(1.7);font:14px/1.6 system-ui,"Hiragino Sans","Yu Gothic",sans-serif;margin:0 auto;padding:16px 20px 48px;max-width:1280px;color:#1f2328}
h1{font-size:20px;margin:8px 0}
th.group{font-size:15px;padding-top:18px;background:var(--bg);border-bottom:2px solid #d0d7de}
.stickyGroup{position:sticky;top:0;height:0;z-index:1;pointer-events:none}
.stickyGroup .panel{position:absolute;left:0;right:0;top:0;height:calc(var(--controls-h,48px) + var(--head-h,33px));background:color-mix(in srgb,var(--th) 50%,transparent);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border-bottom:1px solid rgba(255,255,255,.35);box-shadow:0 10px 30px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.25);transition:height .2s}
.stickyGroup .panel.on{height:calc(var(--controls-h,48px) + var(--head-h,33px) + 42px)}
.stickyGroup .bar{position:absolute;left:0;right:0;top:calc(var(--controls-h,48px) + var(--head-h,33px));height:42px;box-sizing:border-box;font-weight:600}
.stickyGroup .bar .t{position:absolute;left:8px;top:0;bottom:0;display:flex;align-items:center;margin:0;color:inherit;font-weight:600;animation:blur-in .4s ease both}
.stickyGroup .bar .t.leaving{animation:blur-out .4s ease both}
@keyframes blur-in{from{opacity:0;filter:blur(10px);transform:scale(.96)}}
@keyframes blur-out{to{opacity:0;filter:blur(10px);transform:scale(1.06)}}
th.group span,.bar span{font-weight:400;color:#656d76;margin-left:4px}
.note{color:#656d76;margin:4px 0 12px}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;position:sticky;top:0;background:transparent;padding:8px 8px;z-index:3}
.controls label{display:flex;gap:6px;align-items:center}
.controls select,.controls input,.controls button{font:inherit;padding:3px 6px}
.controls input{min-width:220px}
.count{color:#656d76}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{border-bottom:1px solid #eaeef2;padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--th);font-weight:600}
thead th{white-space:nowrap;position:sticky;top:var(--controls-h,48px);z-index:2;background:transparent}
td.name{font-weight:600}
.nowrap{white-space:nowrap}
code{background:#f0f2f4;border-radius:3px;padding:0 3px;font-size:.92em}
td a{margin-right:8px;color:#0969da}
::view-transition-group(*){animation-duration:.35s;animation-timing-function:ease-in-out}
::view-transition-old(*):only-child{animation:fade-out .2s both}
::view-transition-new(*):only-child{animation:fade-in .3s .1s both}
@keyframes fade-in{from{opacity:0}}
@keyframes fade-out{to{opacity:0}}
::view-transition-group(root){animation-duration:.2s}
@media (prefers-reduced-motion:reduce){.stickyGroup .bar .t,.stickyGroup .panel{animation:none!important;transition:none!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
@media (prefers-color-scheme:dark){body{--bg:#0d1117;--th:#161b22;background:#0d1117;color:#e6edf3}.stickyGroup .panel{border-bottom-color:rgba(255,255,255,.12);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}th,td{border-color:#30363d}code{background:#262c36}td a{color:#58a6ff}.note,.count,th.group span{color:#8b949e}select,input,button{background:#161b22;color:inherit;border:1px solid #30363d}}
</style>
</head>
